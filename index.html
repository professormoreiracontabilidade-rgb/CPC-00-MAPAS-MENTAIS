<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103969"><title>CPC 00 (R2) — Professor Moreira</title>
<style>*{box-sizing:border-box}html{background:#e7f1fb;font-family:Arial,Helvetica,sans-serif;color:#12345c}body{margin:0}header{padding:14px 16px;text-align:center;background:#103969;color:white;font-size:15px;font-weight:bold;line-height:1.5}header span{display:block;color:#ffe5a8;font-size:17px}main{max-width:760px;margin:auto;padding:12px 8px calc(118px + env(safe-area-inset-bottom))}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 3px 18px #14365b1f;background:white}figcaption{font-size:16px;line-height:1.5;text-align:center;margin:12px 4px;color:#12345c}nav{position:fixed;bottom:0;left:0;width:100%;padding:10px 10px calc(12px + env(safe-area-inset-bottom));background:#103969;color:white;box-shadow:0 -3px 14px #0002}.buttons{display:flex;gap:9px;max-width:650px;margin:auto}button{flex:1;border:0;border-radius:11px;background:white;color:#103969;padding:15px 8px;font:700 18px Arial;min-height:54px;cursor:pointer}button:disabled{opacity:.38;cursor:default}button:focus-visible{outline:3px solid #ffde8c;outline-offset:3px}#restart{background:#ffe1a1}#counter{text-align:center;font-size:16px;margin:0 0 9px}progress{display:block;width:100%;height:4px;accent-color:#ffd681;border:0;margin-top:9px}#error{background:#fff1d5;padding:18px;border-radius:12px;line-height:1.6}#storage-note{margin:0;padding:9px 12px;background:#fff0cb;font-size:14px}noscript p{padding:18px;background:#fff0cb} @media(min-width:800px){main{padding-top:20px}} @media(max-width:360px){button{font-size:16px}}</style></head>
<body><header>CURSO DE CONTABILIDADE PROFESSOR MOREIRA<span>CPC 00 (R2) — Estrutura Conceitual</span></header>
<p id="storage-note" hidden>Seu navegador não permitiu salvar a última imagem. A navegação continua disponível.</p>
<noscript><p>Ative o JavaScript do navegador para navegar pelas 35 imagens.</p></noscript>
<main><figure><img id="slide" alt="" decoding="async" fetchpriority="high"><figcaption id="caption"></figcaption></figure><p id="error" role="alert" hidden>Não foi possível carregar esta imagem. Verifique se publicou as 35 imagens .webp ao lado do index.html no GitHub Pages. Arquivo ausente: <strong id="missing-file"></strong>.</p></main>
<nav aria-label="Navegação das imagens"><p id="counter" aria-live="polite"></p><div class="buttons"><button id="previous" aria-label="Voltar à imagem anterior">← Voltar</button><button id="restart" aria-label="Reiniciar na primeira imagem">↻ Reiniciar</button><button id="next" aria-label="Ir para a próxima imagem">Avançar →</button></div><progress id="progress" aria-label="Progresso de estudo"></progress></nav>
<script>
(()=>{'use strict';const files=["01_Estrutura_Conceitual.webp", "02_TRANSPARENCIA_PRESTACAO_DE_CONTAS_E_EFICIENCIA.webp", "03_QUEM_USA_OS_RELATORIOS.webp", "04_DECISOES_DOS_USUARIOS_E_LIMITES_DOS_RELATORIOS.webp", "05_INFORMACAO_UTIL_FUNDAMENTAIS_MELHORIA.webp", "06_RELEVANCIA_FAZER_DIFERENCA_NA_DECISAO.webp", "07_MATERIALIDADE_O_QUE_PODE_INFLUENCIAR.webp", "08_REPRESENTACAO_FIDEDIGNA_3_REQUISITOS.webp", "09_FIDEDIGNA_NAO_SIGNIFICA_EXATIDAO_ABSOLUTA.webp", "10_PRUDENCIA_CAUTELA_SEM_DISTORCAO.webp", "11_ESTIMATIVAS_E_ASSIMETRIA.webp", "12_COMPARABILIDADE_CONSISTENCIA_UNIFORMIDADE.webp", "13_COMPARAR_PERIODOS_E_MANTER_POLITICAS.webp", "14_VERIFICACAO_DIRETA_E_INDIRETA.webp", "15_TEMPESTIVIDADE_A_TEMPO_DE_DECIDIR.webp", "16_COMPREENSIBILIDADE_CLAREZA_SEM_OMISSAO.webp", "17_CUSTO_OS_BENEFICIOS_JUSTIFICAM.webp", "18_CONTINUIDADE_OPERACIONAL.webp", "19_PERSPECTIVA_DA_ENTIDADE_E_CONSOLIDACAO.webp", "20_ATIVO_PRESENTE_CONTROLADO_EVENTO_PASSADO.webp", "21_ATIVO_POTENCIAL_NAO_EXIGE_CERTEZA.webp", "22_DIREITOS_QUE_PODEM_REPRESENTAR_ATIVOS.webp", "23_PASSIVO_A_OBRIGACAO_JA_EXISTE.webp", "24_PATRIMONIO_LIQUIDO_RESULTADO.webp", "25_RECEITAS_E_DESPESAS.webp", "26_E_RECEITA_OU_NAO.webp", "27_NATUREZA_DEVEDORA_E_CREDORA.webp", "28_RECONHECER_NAO_E_AUTOMATICO.webp", "29_DESRECONHECIMENTO_QUANDO_RETIRAR.webp", "30_MENSURACAO_E_CUSTO_HISTORICO.webp", "31_ESCOLHA_DA_BASE_DE_MENSURACAO.webp", "32_CAPITAL_FINANCEIRO_CAPITAL_FISICO.webp", "33_LUCRO_EXCLUA_AS_OPERACOES_COM_SOCIOS.webp", "34_REVISAO_CARACTERISTICAS_QUALITATIVAS.webp", "35_REVISAO_ELEMENTOS_E_PEGADINHAS_FGV.webp"];const key='professor-moreira-cpc00-imagens-v1';
const missingFile=document.getElementById('missing-file');const slide=document.getElementById('slide'),caption=document.getElementById('caption'),counter=document.getElementById('counter'),previous=document.getElementById('previous'),next=document.getElementById('next'),restart=document.getElementById('restart'),progress=document.getElementById('progress'),error=document.getElementById('error');
let index=0,positions={},storage=true,restoring=false,scrollTimer;
try{const state=JSON.parse(localStorage.getItem(key)||'null');if(state&&Number.isInteger(state.index)&&state.index>=0&&state.index<files.length){index=state.index;positions=state.positions&&typeof state.positions==='object'?state.positions:{}}localStorage.setItem(key,JSON.stringify({index,positions}));}catch(e){storage=false;document.getElementById('storage-note').hidden=false;}
function persist(){if(!storage)return;try{localStorage.setItem(key,JSON.stringify({index,positions}));}catch(e){storage=false;document.getElementById('storage-note').hidden=false;}}
function save(){if(restoring)return;positions[index]=window.scrollY;persist();}
function show(){restoring=true;const current=index;error.hidden=true;slide.hidden=false;previous.disabled=index===0;next.disabled=index===files.length-1;const name=files[index].replace(/^\d+_/,'').replace(/\.webp$/,'').replace(/_/g,' ');slide.alt=`Imagem ${index+1} de ${files.length}: ${name}`;caption.textContent=name;counter.textContent=`Imagem ${index+1} de ${files.length}`;progress.max=files.length;progress.value=index+1;document.title=`CPC 00 (R2) • ${index+1}/${files.length} • Professor Moreira`;slide.onload=()=>{if(index!==current)return;window.scrollTo(0,Number(positions[current])||0);restoring=false;};slide.onerror=()=>{if(index!==current)return;missingFile.textContent=files[current];error.hidden=false;slide.hidden=true;restoring=false;};window.scrollTo(0,0);slide.src=files[index];persist();if(index+1<files.length){const preload=new Image();preload.src=files[index+1];}}
function go(value){save();index=Math.max(0,Math.min(files.length-1,value));show();}
previous.addEventListener('click',()=>go(index-1));next.addEventListener('click',()=>go(index+1));restart.addEventListener('click',()=>{index=0;positions={};show();});
window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(save,150);},{passive:true});window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1);}});show();
})();
</script></body></html>
